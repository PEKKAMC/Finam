name: Build Mobile Artifacts

on:
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android (APK & AAB)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '25'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android Licenses
        run: |
          yes | sdkmanager --licenses
          sdkmanager "build-tools;34.0.0" "platforms;android-34"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install Flet
        run: |
          python -m pip install --upgrade pip
          pip install flet

      - name: Build APK
        run: flet build apk --build-version 0.0.1 --module-name main --yes -v

      - name: Build AAB (App Bundle)
        run: flet build aab --build-version 0.0.1 --module-name main --yes -v

      - name: Generate Checksums
        run: |
          cd build
          sha256sum apk/*.apk aab/*.aab > checksums-android.txt

      - name: Upload Android Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: flet-android-builds
          path: |
            build/apk/Finam.apk
            build/aab/Finam.aab
            build/checksums-android.txt

  build-ios:
    name: Build iOS (IPA)
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install Flet
        run: |
          python -m pip install --upgrade pip
          pip install flet

      - name: Build IPA (Generates xcarchive)
        run: flet build ipa --build-version 0.0.1 --module-name main --yes -v

      - name: Convert to Sideloadable IPA & Generate Checksum
        run: |
          mkdir -p Payload
          mv build/ipa/*.xcarchive/Products/Applications/*.app Payload/
          zip -qr Finam.ipa Payload
          
          shasum -a 256 Finam.ipa > checksums-ios.txt

      - name: Upload iOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ios-release-artifacts
          path: |
            Finam.ipa
            checksums-ios.txt