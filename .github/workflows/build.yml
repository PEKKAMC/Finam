name: Build Mobile Artifacts

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-android:
    name: Build Android (APK & AAB)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '25'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android Licenses
        run: |
          yes | sdkmanager --licenses
          sdkmanager "build-tools;34.0.0" "platforms;android-34"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install Flet
        run: |
          python -m pip install --upgrade pip
          pip install flet

      - name: Build APK
        run: flet build apk --build-version 0.0.1 --module-name main --yes -v

      - name: Build AAB (App Bundle)
        run: flet build aab --build-version 0.0.1 --module-name main --yes -v

      - name: Extract Mapping File & Generate Checksums
        run: |
          find /tmp -type f -name "mapping.txt" -exec cp {} build/apk/mapping.txt \; || echo "No mapping.txt found"
          cd build
          sha256sum apk/*.apk apk/mapping.txt aab/*.aab > checksums-android.txt

      - name: Upload Android Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: flet-android-builds
          path: |
            build/apk/*.apk
            build/aab/*.aab
            build/apk/mapping.txt
            build/checksums-android.txt

  build-ios:
    name: Build iOS (IPA)
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install Flet
        run: |
          python -m pip install --upgrade pip
          pip install flet

      - name: Build IPA (Generates xcarchive)
        run: flet build ipa --build-version 0.0.1 --module-name main --yes -v

      - name: Convert to Sideloadable IPA & Generate Checksum
        run: |
          mkdir -p Payload
          mv build/ipa/*.xcarchive/Products/Applications/*.app Payload/
          zip -qr app-release.ipa Payload
          
          # Generate SHA-256 checksum (macOS uses shasum)
          shasum -a 256 app-release.ipa > checksums-ios.txt

      - name: Upload iOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ios-release-artifacts
          path: |
            app-release.ipa
            checksums-ios.txt