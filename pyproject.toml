[project]
name = "Finam"
version = "0.1.0"
description = "Financial Learning App"
readme = "README.md"
requires-python = ">=3.14"
authors = [
    { name = "PEKKAMC", email = "prochess960@gmail.com" }
]
dependencies = [
    "flet>=0.86.4",
    "flet_audio>=0.86.4",
    "flet-charts>=0.86.4",
    "colorlog>=6.12.0",
    "openpyxl>=3.1.5",
    "google-genai>=2.15.0"
]

[dependency-groups]
dev = [
    "flet-cli>=0.86.4",
    "flet-desktop>=0.86.4",
    "flet-web>=0.86.4"
]

[tool.flet]
org = "net.pekkamc"
product = "Finam"
company = "PEKKAMC"
copyright = "Copyright (C) 2026 by PEKKAMC"

[tool.flet.app]
path = ""
assets = "assets"
exclude = [
    "venv",
    ".venv",
    ".git",
    "build",
    "dist",
    "__pycache__",
    "*.db",
    "tests"
]

[tool.setuptools]
include-package-data = true

[project.scripts]
run-app = "main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.setuptools.package-data]
"*" = ["assets/**", "*.db", "*.png", "*.json"]
