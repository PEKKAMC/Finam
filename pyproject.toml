[project]
name = "Finam"
version = "0.4.4"
description = "Financial Learning App"
readme = "README.md"
requires-python = ">=3.14"
authors = [
    { name = "PEKKAMC", email = "prochess960@gmail.com" }
]
dependencies = [
    "flet>=1.0.5",
    "flet_ads>=1.0.5",
    "flet_audio>=1.0.5",
    "flet-charts>=1.0.5",
    "colorlog>=6.12.0",
    "openpyxl>=3.1.5",
    "requests>=2.34.2"
]

[dependency-groups]
dev = [
    "flet-cli>=1.0.5",
    "flet-desktop>=1.0.5",
    "flet-web>=1.0.5"
]

[tool.flet]
org = "net.pekkamc"
product = "Finam"
company = "PEKKAMC"
copyright = "Copyright (C) 2026 by PEKKAMC"

[tool.flet.deep_linking]
scheme = "net.pekkamc.finam"
host = "oauth_callback"

[tool.flet.android.deep_linking]
scheme = "net.pekkamc.finam"
host = "oauth_callback"

[tool.flet.ios.deep_linking]
scheme = "net.pekkamc.finam"
host = "oauth_callback"

[tool.flet.android.meta_data]
"com.google.android.gms.ads.APPLICATION_ID" = "ca-app-pub-3940256099942544~3347511713"

[tool.flet.ios.info]
GADApplicationIdentifier = "ca-app-pub-3940256099942544~3347511713"

[tool.flet.app]
path = ""
assets = "assets"
exclude = [
    "venv",
    ".venv",
    ".git",
    "build",
    "dist",
    "__pycache__",
    "*.db",
    "tests"
]

[tool.setuptools]
include-package-data = true

[project.scripts]
run-app = "main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.setuptools.package-data]
"*" = ["assets/**", "*.db", "*.png", "*.json"]
